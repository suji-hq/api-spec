  /v1/orgs/{orgSlug}/projects/{projectSlug}/instances/{id}/snapshot:
    post:
      operationId: createInstanceSnapshot
      summary: Create a snapshot of an instance
      description: >-
        Queue a snapshot of the instance's disk. Defaults to `mode: "cold"`
        (briefly powers the VM off for a consistent snapshot); `mode: "hot"`
        snapshots the live disk with no downtime. Returns immediately with
        `status: "uploading"` and `progress: 0`; clients poll `GET
        /:id/snapshots` to watch progress. If the snapshot quota is at its
        limit, the oldest manual snapshot is auto-rotated before the new one
        starts.


        Gated on the spending hard cap. Note the path is singular (`/snapshot`)
        — the matching list endpoint is plural (`/snapshots`).
      tags:
        - Instances
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum:
                    - hot
                    - cold
                  default: cold
                  description: >-
                    `cold` (default) briefly powers the VM off for a consistent
                    on-disk snapshot. `hot` snapshots the live disk with no
                    downtime but may capture in-flight writes.
                  example: cold
      responses:
