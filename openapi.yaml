                  - result
                  - errors
                  - messages
    delete:
      operationId: deleteInstance
      summary: Delete an instance
      description: >-
        Schedule the instance for deprovisioning — flips status to
        `deprovisioning` and enqueues a `vm-deprovision` background job.
        Repeated DELETEs against an already-deprovisioning instance are
        idempotent no-ops. The row vanishes from list responses once the
        background job completes.
      tags:
        - Instances
      responses:
        '202':
          description: Deprovision enqueued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  result:
                    type: object
                    properties:
                      id:
                        type: string
                      status:
                        type: string
                        const: deprovisioning
                    required:
                      - id
                      - status
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                        documentation_url:
                          type: string
                        source:
                          type: object
                          properties:
