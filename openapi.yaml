                      rules:
                        type: array
                        items:
                          type: object
                          properties:
                            direction:
                              type: string
                              enum:
                                - in
                                - out
                            protocol:
                              type: string
                              enum:
                                - tcp
                                - udp
                                - icmp
                                - esp
                                - gre
                            port:
                              type: string
                              pattern: ^(\d{1,5}(-\d{1,5})?|any)$
                            source_ips:
                              type: array
