openapi: 3.1.0
info:
  title: Suji API
  description: >-
    Customer-facing REST API for the Suji platform.


    **Authentication.** When both an Authorization Bearer token and a session
    cookie are present, the Bearer token takes precedence and the session cookie
    is ignored.


    **Envelope.** Every JSON response is wrapped in a Cloudflare-style envelope:
    `{ success, result, errors: [], messages: [] }`. List responses additionally
    include `result_info` with pagination metadata.


    **Versioning.** This is `/v1`. Breaking changes will land at `/v2` with v1
    kept alive until customer telemetry shows < 5% of calls.
  version: 1.0.0
  contact:
    name: Suji Support
    email: support@suji.fr
    url: https://suji.fr
  license:
    name: Proprietary — see suji.fr/terms
servers:
  - url: https://api.suji.fr
    description: Production
tags:
  - name: API tokens
    description: Issue and revoke personal access tokens for programmatic access.
  - name: SSH keys
    description: Manage SSH public keys distributed to your VMs.
  - name: Quotas
    description: Read your organization's resource limits and current usage.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: suji_pat_*
      description: >-
        Personal access token. Scope is `read` (GET only) or `read-write`
        (full).
    sessionCookie:
      type: apiKey
      in: cookie
      name: suji_session
      description: Browser session cookie. Cannot be used from non-browser clients.
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
