  /v1/orgs/{orgSlug}/projects/{projectSlug}/analytics/overview:
    get:
      operationId: getAnalyticsOverview
      summary: Get project analytics overview
      description: >-
        Per-project resource utilization summary. Returns:


        - **`pool`** — caps (CPU millicores, memory bytes, storage bytes,
        instance count) and the current allocation summed across
        non-deprovisioning instances.

        - **`instances[]`** — per-instance row with the latest live
        CPU/memory/storage usage from Redis (nullable when the worker snapshot
        is stale).

        - **`trends`** — 7-day trend series queried best-effort from Mimir
        (empty arrays if the metrics backend is unreachable). Each point is `{
        t, v }` where `t` is unix seconds and `v` is **millicores for `cpu`, MiB
        for `memory`, GiB for `storage`**.
      tags:
        - Analytics
      responses:
        '200':
          description: Project analytics overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  result:
                    type: object
                    properties:
                      pool:
                        type: object
                        properties:
                          cpu:
                            type: object
                            properties:
                              limitMillicores:
                                type: number
                              usedMillicores:
                                type: number
                            required:
                              - limitMillicores
                              - usedMillicores
                          memory:
                            type: object
                            properties:
                              limitBytes:
                                type: number
                              usedBytes:
                                type: number
                            required:
                              - limitBytes
                              - usedBytes
                          storage:
                            type: object
                            properties:
                              limitBytes:
                                type: number
                              usedBytes:
                                type: number
                            required:
                              - limitBytes
                              - usedBytes
                          instances:
                            type: object
                            properties:
                              limit:
                                type: number
                              used:
                                type: number
                            required:
                              - limit
                              - used
                        required:
                          - cpu
                          - memory
                          - storage
                          - instances
                      instances:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            subdomain:
                              type:
                                - string
                                - 'null'
                            status:
                              type: string
                              enum:
                                - provisioning
                                - running
                                - stopping
                                - stopped
                                - starting
                                - restarting
                                - suspended
                                - error
                                - deprovisioning
                                - rebuilding
                                - restoring
                            cpuPercent:
                              type:
                                - number
                                - 'null'
                            memoryPercent:
                              type:
                                - number
                                - 'null'
                            storageUsedBytes:
                              type:
                                - number
                                - 'null'
                            cpuMillicores:
                              type: number
                            memoryGi:
                              type: number
                            storageGi:
                              type: number
                          required:
                            - id
                            - subdomain
                            - status
                            - cpuPercent
                            - memoryPercent
                            - storageUsedBytes
                            - cpuMillicores
                            - memoryGi
                            - storageGi
                      trends:
                        type: object
                        properties:
                          cpu:
                            type: array
                            items:
                              type: object
                              properties:
                                t:
                                  type: number
                                v:
                                  type: number
                              required:
                                - t
                                - v
                          memory:
                            type: array
                            items:
                              type: object
                              properties:
                                t:
                                  type: number
                                v:
                                  type: number
                              required:
                                - t
                                - v
                          storage:
                            type: array
                            items:
                              type: object
                              properties:
                                t:
                                  type: number
                                v:
                                  type: number
                              required:
                                - t
                                - v
                        required:
                          - cpu
                          - memory
                          - storage
                    required:
                      - pool
                      - instances
                      - trends
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                        documentation_url:
                          type: string
                        source:
                          type: object
                          properties:
                            pointer:
                              type: string
                          required:
                            - pointer
                      required:
                        - code
                        - message
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                      required:
                        - code
                        - message
                required:
                  - success
                  - result
                  - errors
                  - messages
        '403':
          description: Not a member of this organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: false
                  result:
                    type: 'null'
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
