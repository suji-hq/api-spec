    post:
      operationId: restartInstance
      summary: Restart an instance
      description: >-
        Enqueue a restart (stop-then-start) of a running instance. Flips the
        status to `restarting` immediately and returns; the worker performs the
        restart asynchronously and flips back to `running` on completion. Only
        valid from `running`.
