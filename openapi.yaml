                  - result
                  - errors
                  - messages
      parameters:
        - schema:
            type: string
          in: path
          name: orgSlug
          required: true
        - schema:
            type: string
          in: path
          name: projectSlug
          required: true
  /v1/orgs/{orgSlug}/projects/{projectSlug}/instances/{id}:
    patch:
      operationId: renameInstance
      summary: Rename an instance
      description: >-
        Rename an instance (the only PATCH-able field today — resize will land
        in a later release). Supports optimistic concurrency via the
        `If-Unmodified-Since` request header (HTTP-date at 1-second
        granularity); a mismatch returns 409 `CONCURRENT_MODIFICATION` so the
        client can refetch the current `updatedAt` and retry.
      tags:
        - Instances
      parameters:
        - in: header
          name: If-Unmodified-Since
          required: false
          description: >-
            HTTP-date guarding against concurrent edits. The request fails with
            409 `CONCURRENT_MODIFICATION` if the resource has been modified
            since this timestamp (matched at 1-second granularity).
          schema:
            type: string
            format: http-date
        - schema:
            type: string
          in: path
          name: orgSlug
          required: true
        - schema:
            type: string
          in: path
          name: projectSlug
          required: true
        - schema:
            type: string
          in: path
          name: id
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  pattern: ^[a-zA-Z0-9 _-]+$
                  minLength: 1
                  maxLength: 60
      responses:
        '200':
          description: Renamed instance
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  result:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type:
                          - string
                          - 'null'
                      updatedAt:
                        type: string
                    required:
                      - id
                      - name
                      - updatedAt
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                        documentation_url:
                          type: string
                        source:
                          type: object
                          properties:
                            pointer:
                              type: string
                          required:
                            - pointer
                      required:
                        - code
                        - message
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
