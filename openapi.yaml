                        - message
                required:
                  - success
                  - result
                  - errors
                  - messages
      parameters:
        - schema:
            type: string
          in: path
          name: orgSlug
          required: true
        - schema:
            type: string
          in: path
          name: projectSlug
          required: true
    get:
      operationId: listInstances
      summary: List instances
      description: >-
        List every active instance in the current project. Deprovisioning rows
        are excluded (they vanish from this list as soon as their delete job is
        enqueued). The list itself is unpaginated metadata-wise — pass `?limit=`
        (1-100, default 100) and `?offset=` to page; the response echoes them
        back as `X-Limit` / `X-Offset` headers so clients can chain follow-up
        calls without re-parsing the query string.
      tags:
        - Instances
      responses:
        '200':
          description: Instance list (excludes deprovisioning rows)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        userId:
                          type:
                            - string
                            - 'null'
                        status:
                          type: string
                          enum:
                            - provisioning
                            - running
                            - stopping
                            - stopped
                            - starting
                            - restarting
                            - suspended
                            - error
                            - deprovisioning
                            - rebuilding
                            - restoring
                        name:
                          type:
                            - string
                            - 'null'
                        region:
                          type:
                            - string
                            - 'null'
                          enum:
                            - eu-falkenstein
                            - eu-nuremberg
                            - eu-helsinki
                            - null
                        regionLabel:
                          type:
                            - string
                            - 'null'
                        vmSize:
                          type:
                            - string
                            - 'null'
                          enum:
                            - small
                            - medium
                            - large
                            - xl
                            - null
                        cpuMillicores:
                          type: integer
                        memoryGi:
                          type: number
                        storageGi:
                          type: integer
                        publicIp:
                          type:
                            - string
                            - 'null'
                        hasTunnel:
                          type: boolean
                        projectId:
                          type: string
                        config:
                          type:
                            - object
                            - 'null'
                          additionalProperties: {}
                        provisionedAt:
                          type:
                            - string
                            - 'null'
                        stoppedAt:
                          type:
                            - string
                            - 'null'
                        suspendedAt:
                          type:
                            - string
                            - 'null'
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                      required:
                        - id
                        - userId
                        - status
                        - name
                        - region
                        - regionLabel
                        - vmSize
                        - cpuMillicores
                        - memoryGi
                        - storageGi
                        - publicIp
                        - hasTunnel
                        - projectId
                        - config
                        - provisionedAt
                        - stoppedAt
                        - suspendedAt
                        - createdAt
                        - updatedAt
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                        documentation_url:
                          type: string
                        source:
                          type: object
                          properties:
                            pointer:
                              type: string
                          required:
                            - pointer
                      required:
                        - code
                        - message
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                      required:
                        - code
                        - message
                required:
                  - success
                  - result
                  - errors
                  - messages
      parameters:
        - schema:
            type: string
          in: path
          name: orgSlug
          required: true
        - schema:
            type: string
          in: path
          name: projectSlug
          required: true
  /v1/orgs/{orgSlug}/projects/{projectSlug}/instances/{id}:
    patch:
      operationId: renameInstance
      summary: Rename an instance
      description: >-
        Update an instance's display `name`. (CPU / memory / storage are not
        PATCH-able here — use `POST /instances/{id}/resize` for those.) Supports
        optimistic concurrency via the `If-Unmodified-Since` request header
        (HTTP-date at 1-second granularity); a mismatch returns 409
        `CONCURRENT_MODIFICATION` so the client can refetch the current
        `updatedAt` and retry.
      tags:
        - Instances
      parameters:
        - in: header
          name: If-Unmodified-Since
          required: false
          description: >-
            HTTP-date guarding against concurrent edits. The request fails with
            409 `CONCURRENT_MODIFICATION` if the resource has been modified
            since this timestamp (matched at 1-second granularity).
          schema:
            type: string
            format: http-date
        - schema:
            type: string
          in: path
          name: orgSlug
          required: true
        - schema:
            type: string
          in: path
          name: projectSlug
          required: true
        - schema:
            type: string
          in: path
          name: id
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  pattern: ^[a-zA-Z0-9 _-]+$
                  minLength: 1
                  maxLength: 60
      responses:
        '200':
          description: Renamed instance
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  result:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type:
                          - string
                          - 'null'
                      updatedAt:
                        type: string
                    required:
                      - id
                      - name
                      - updatedAt
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                        documentation_url:
                          type: string
                        source:
                          type: object
                          properties:
                            pointer:
                              type: string
                          required:
                            - pointer
                      required:
                        - code
