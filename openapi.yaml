    post:
      operationId: resizeVolume
      summary: Resize a volume
      description: >-
        Grow a volume to a larger size. Shrinking is not supported. If the
        volume is attached to a running instance with `autoMount`, the in-VM
        filesystem is grown best-effort via the guest-agent; a failure to grow
        the filesystem is non-fatal (the volume itself is resized at the
        provider).
