    post:
      operationId: rotateInstallSecrets
      summary: Rotate auto-generated secrets
      description: >-
        Regenerate the `auto_generate: true` secret fields declared by the
        install's manifest, then enqueue an `app-upgrade` so the running
        container picks up the new values via environment variables. Pass `keys`
        to restrict rotation to a subset of auto-generate fields; omit it to
        rotate every auto-generate field. User-supplied secrets are never
        touched.
      tags:
        - App installs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keys:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 64
                  maxItems: 20
      responses:
        '202':
          description: Rotation enqueued — install is now upgrading
          content:
            application/json:
              schema:
