openapi: 3.1.0
info:
  title: Suji API
  description: >-
    Customer-facing REST API for the Suji platform.


    **Authentication.** When both an Authorization Bearer token and a session
    cookie are present, the Bearer token takes precedence and the session cookie
    is ignored.


    **Envelope.** Every JSON response is wrapped in a Cloudflare-style envelope:
    `{ success, result, errors: [], messages: [] }`. List responses additionally
    include `result_info` with pagination metadata.


    **Versioning.** This is `/v1`. Breaking changes will land at `/v2` with v1
    kept alive until customer telemetry shows < 5% of calls.
  version: 1.0.0
  contact:
    name: Suji Support
    email: support@suji.fr
    url: https://suji.fr
  license:
    name: Proprietary — see suji.fr/terms
servers:
  - url: https://api.suji.fr
    description: Production
tags:
  - name: Organizations
    description: >-
      Your account is a member of one or more organizations. Manage organization
      membership, settings, and project layout.
  - name: API tokens
    description: Issue and revoke personal access tokens for programmatic access.
  - name: SSH keys
    description: Manage SSH public keys distributed to your VMs.
  - name: Quotas
    description: Read your organization's resource limits and current usage.
  - name: Instances
    description: OpenClaw VMs — create, list, manage lifecycle, snapshot, monitor.
  - name: Snapshots
    description: List, restore, and delete VM disk snapshots stored at the cloud provider.
  - name: Volumes
    description: >-
      Block storage volumes attached to your VMs — create, resize, attach,
      detach.
  - name: Connectors
    description: >-
      Messaging-channel credentials per OpenClaw install — Discord, Slack,
      Telegram, etc.
  - name: App installs
    description: >-
      App lifecycle on a specific instance — install from a catalog/org
      template, configure, upgrade, rotate secrets, restart, uninstall.
  - name: Project spending cap
    description: >-
      Per-project monthly spending cap — blocks new provisioning past the limit
      (running resources are never killed, auto-recharge is unaffected).
  - name: Org billing
    description: >-
      Org-level billing profile (company / tax / address) and spending controls
      (soft + hard caps, per-member caps). Admin+ only on every verb.
  - name: Project preferences
    description: >-
      Default settings applied to new instances in the project (default SSH key,
      default backup retention, …).
  - name: Org templates
    description: >-
      Per-organization customized app templates — clone a public catalog
      template and tweak its manifest or compose for your org.
  - name: Apps catalog
    description: >-
      Public catalog of installable app templates — list, browse, and pick a
      version to install on your instances.
  - name: Analytics
    description: >-
      Per-project resource utilization overview — pool limits, per-instance
      usage, and 7-day trend series.
  - name: Audit log
    description: >-
      Read your organization's audit trail — every user / token action that
      touched a resource. Mounted at both org-wide and per-project paths.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: suji_pat_*
      description: >-
        Personal access token. Scope is `read` (GET only) or `read-write`
        (full).
    sessionCookie:
      type: apiKey
      in: cookie
      name: suji_session
      description: Browser session cookie. Cannot be used from non-browser clients.
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /v1/orgs/{orgSlug}/projects/{projectSlug}/instances:
    post:
      operationId: createInstance
      summary: Create an instance
      description: >-
        Create a new OpenClaw VM in the given region. Returns immediately once
        the provisioning job is enqueued — the VM transitions through
        `provisioning` → `running` asynchronously. Quota, platform capacity, and
        spending hard-caps are all checked up-front; exceeded limits fail
        without enqueueing the job. The wire contract is provider-neutral:
        `vmSize` and `region` are Suji slugs (e.g. `small` / `eu-falkenstein`),
        translated to the underlying provider type internally. Optionally
        include `sshPubkey` to seed the root account with your public key.
      tags:
        - Instances
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  pattern: ^[a-zA-Z0-9 _-]+$
                  minLength: 1
                  maxLength: 60
                region:
                  type: string
                  enum:
                    - eu-falkenstein
                    - eu-nuremberg
                    - eu-helsinki
                vmSize:
                  type: string
                  enum:
                    - small
                    - medium
                    - large
                    - xl
                sshPubkey:
                  type: string
                  pattern: >-
                    ^(ssh-rsa|ssh-ed25519|ecdsa-sha2-nistp(?:256|384|521))\s+[A-Za-z0-9+/=]+(?:\s+.+)?$
              required:
                - name
                - region
                - vmSize
      responses:
        '201':
          description: Instance create accepted; provisioning enqueued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  result:
                    type: object
                    properties:
                      id:
                        type: string
                      status:
                        type: string
                        const: provisioning
                      name:
                        type: string
                      region:
                        type: string
                        enum:
                          - eu-falkenstein
                          - eu-nuremberg
                          - eu-helsinki
                      vmSize:
                        type: string
                        enum:
                          - small
                          - medium
                          - large
                          - xl
                    required:
                      - id
                      - status
                      - name
                      - region
                      - vmSize
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                        documentation_url:
                          type: string
                        source:
                          type: object
                          properties:
                            pointer:
                              type: string
                          required:
                            - pointer
                      required:
                        - code
                        - message
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                      required:
                        - code
                        - message
                required:
                  - success
                  - result
                  - errors
                  - messages
        '402':
          description: Spending hard cap exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: false
                  result:
                    type: 'null'
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                        documentation_url:
                          type: string
                        source:
                          type: object
                          properties:
                            pointer:
                              type: string
                          required:
                            - pointer
                      required:
                        - code
                        - message
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                      required:
                        - code
                        - message
                required:
                  - success
                  - result
                  - errors
                  - messages
        '403':
