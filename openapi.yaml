    get:
      operationId: getQuotaUsage
      summary: Get quota usage
      description: >-
        Read-only quota overview for the current organization. Returns the
        configured `limits` (or platform defaults if none have been overridden),
        the current `usage` summed across every project in the org (excluding
        instances being deprovisioned), and a `hasOverride` flag indicating
        whether a custom quota row exists.
      tags:
        - Quotas
      responses:
        '200':
          description: Quota usage overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  result:
                    type: object
                    properties:
                      limits:
                        type: object
                        properties:
                          maxInstances:
                            type: number
                          maxVolumes:
