                        - message
                required:
                  - success
                  - result
                  - errors
                  - messages
        '503':
          description: >-
            Platform-wide provisioning capacity reached (servers, vCPUs, or
            primary IPs)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: false
                  result:
