openapi: 3.1.0
info:
  title: Suji API
  description: >-
    Customer-facing REST API for the Suji platform. When both an Authorization
    Bearer token and a session cookie are present, the Bearer token takes
    precedence and the session cookie is ignored.
  version: 1.0.0
servers:
  - url: https://api.suji.fr
    description: Production
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: suji_pat_*
      description: >-
        Personal access token. Scope is `read` (GET only) or `read-write`
        (full).
    sessionCookie:
      type: apiKey
      in: cookie
      name: suji_session
      description: Browser session cookie. Cannot be used from non-browser clients.
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /orgs/{orgSlug}/projects/{projectSlug}/api-tokens:
    get:
      operationId: getOrgsByOrgSlugProjectsByProjectSlugApiTokens
      description: >-
        List API tokens for the current project. Revoked tokens are kept visible
        for 30 days.
      tags:
        - API tokens
      responses:
        '200':
          description: Token list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        userId:
                          type:
                            - string
                            - 'null'
                        name:
                          type: string
                        tokenPrefix:
                          type: string
                        scope:
                          type: string
                          enum:
                            - read
                            - read-write
                        expiresAt:
                          type:
                            - string
                            - 'null'
                        lastUsedAt:
                          type:
                            - string
                            - 'null'
                        revokedAt:
                          type:
                            - string
                            - 'null'
                        createdAt:
                          type: string
                      required:
                        - id
                        - userId
                        - name
                        - tokenPrefix
                        - scope
                        - expiresAt
                        - lastUsedAt
                        - revokedAt
                        - createdAt
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                        documentation_url:
                          type: string
                        source:
                          type: object
                          properties:
                            pointer:
                              type: string
                          required:
                            - pointer
                      required:
                        - code
                        - message
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                      required:
                        - code
                        - message
                required:
                  - success
                  - result
                  - errors
                  - messages
        '400':
          description: No project selected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: false
                  result:
                    type: 'null'
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                        documentation_url:
                          type: string
                        source:
                          type: object
                          properties:
                            pointer:
                              type: string
                          required:
                            - pointer
                      required:
                        - code
                        - message
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                      required:
                        - code
                        - message
                required:
                  - success
                  - result
                  - errors
                  - messages
      parameters:
        - schema:
            type: string
          in: path
          name: orgSlug
          required: true
        - schema:
            type: string
          in: path
          name: projectSlug
          required: true
    post:
      operationId: postOrgsByOrgSlugProjectsByProjectSlugApiTokens
      description: >-
        Create a new API token. Session-only (requires sudo). The plaintext
        token is returned ONCE in the response — store it immediately.
      tags:
        - API tokens
      security:
        - sessionCookie: []
      responses:
        '201':
          description: Created — plaintext token returned once
          content:
            application/json:
              schema:
                type: object
