  /v1/orgs/{orgSlug}/projects/{projectSlug}/instances/{id}/metrics:
    get:
      operationId: getInstanceMetrics
      summary: Get live instance metrics
      description: >-
        Return the most recent CPU, memory, network, storage, and uptime probe
        data for the instance, plus a rolling 10-minute history series for each
        (stored in Redis, sampled on each call). Storage / network counters are
        absolute; the network `history` block surfaces per-sample throughput
        rates derived from the deltas.
      tags:
        - Instances
      responses:
        '200':
          description: Live metrics snapshot + 10-minute history window
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  result:
                    type: object
                    properties:
                      cpu:
                        type: object
                        properties:
                          usage:
                            type: string
                          percent:
                            type: number
                          history:
                            type: array
                            items:
                              type: object
                              properties:
                                t:
                                  type: number
                                v:
                                  type: number
                              required:
                                - t
                                - v
                        required:
                          - usage
                          - percent
                          - history
                      memory:
                        type: object
                        properties:
                          usage:
                            type: string
                          percent:
                            type: number
                          history:
                            type: array
                            items:
                              type: object
                              properties:
                                t:
                                  type: number
                                v:
                                  type: number
                              required:
                                - t
                                - v
                          limitMi:
                            type: number
                          guestUsage:
                            type: string
                          guestPercent:
                            type: number
                          guestHistory:
                            type: array
                            items:
                              type: object
                              properties:
                                t:
                                  type: number
                                v:
                                  type: number
                              required:
                                - t
                                - v
                        required:
                          - usage
                          - percent
                          - history
                          - limitMi
                      vm:
                        type: object
                        properties:
                          state:
                            type: string
                            enum:
                              - running
                              - unknown
                          pid:
                            type:
                              - number
                              - 'null'
                          startedAt:
                            type:
                              - string
                              - 'null'
                          uptimeSeconds:
                            type: number
                        required:
                          - state
                          - pid
                          - startedAt
                          - uptimeSeconds
                      uptime:
                        type: array
                        items:
                          type: object
                          properties:
                            healthy:
                              type: boolean
                            responseTimeMs:
                              type:
                                - number
                                - 'null'
                            checkedAt:
                              type: string
                          required:
                            - healthy
                            - responseTimeMs
                            - checkedAt
                      network:
                        type: object
                        properties:
                          rxBytes:
                            type: number
                          txBytes:
                            type: number
                          history:
                            type: array
                            items:
                              type: object
                              properties:
                                t:
                                  type: number
                                rx:
                                  type: number
                                tx:
                                  type: number
                              required:
                                - t
                                - rx
                                - tx
                        required:
                          - rxBytes
                          - txBytes
                          - history
                      storage:
                        type: object
                        properties:
                          usedBytes:
                            type: number
                          capacityBytes:
                            type: number
                          percent:
                            type: number
                        required:
                          - usedBytes
                          - capacityBytes
                          - percent
                    required:
                      - cpu
                      - memory
                      - vm
                      - uptime
                      - network
                      - storage
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
