        (default true) are pushed to every running instance in the project and
        applied to every new instance at boot.
      tags:
        - SSH keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Human-readable name for the key (1–100 chars).
                  example: macbook
                publicKey:
                  type: string
                  minLength: 1
                  maxLength: 8192
                  description: >-
                    SSH public key in OpenSSH format. Supported algorithms:
                    `ssh-ed25519`, `ssh-rsa`, `ecdsa-sha2-nistp256/384/521`.
                    Private keys are rejected.
                  example: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleKey macbook@home
                applyToAll:
                  type: boolean
