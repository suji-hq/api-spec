                  - result
                  - errors
                  - messages
    delete:
      operationId: deleteInstance
      summary: Delete an instance
      description: >-
        Schedule the instance for deprovisioning. Status flips to
        `deprovisioning` and the VM is torn down asynchronously. Repeated
        DELETEs against an already-deprovisioning instance are idempotent
        no-ops. The row vanishes from list responses once the deprovision
        completes.
      tags:
        - Instances
      responses:
        '202':
          description: Deprovision enqueued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  result:
                    type: object
                    properties:
                      id:
                        type: string
                      status:
                        type: string
                        const: deprovisioning
                    required:
                      - id
                      - status
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                        documentation_url:
                          type: string
                        source:
                          type: object
                          properties:
                            pointer:
                              type: string
                          required:
                            - pointer
                      required:
                        - code
                        - message
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                      required:
