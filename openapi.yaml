        hourly from creation; quota and credit-balance checks are enforced
        before the cloud-provider call. Optionally `autoMount: true` (default)
        leaves the volume ready to be attached and mounted on a running
        instance, formatting it with `filesystem` (`ext4` or `xfs`).
