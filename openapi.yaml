    post:
      operationId: createVolume
      summary: Create a volume
      description: >-
        Create a block-storage volume in the given region. The volume is billed
        hourly from creation; quota and credit-balance checks are enforced
        before provisioning. Set `autoMount: true` (default) to leave the volume
        ready to be attached and mounted on a running instance, formatting it
        with `filesystem` (`ext4` or `xfs`).
      tags:
        - Volumes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                  minLength: 3
                  maxLength: 63
                  description: >-
                    Volume name. 3–63 chars, lowercase alphanumeric with
                    hyphens; must start and end with a letter or number.
                  example: pgdata
                sizeGb:
                  type: integer
                  minimum: 10
                  maximum: 10240
                  description: >-
                    Volume size in gibibytes. Min 10 GiB, max 10240 GiB. Billed
                    hourly from creation.
                  example: 50
                region:
                  type: string
                  enum:
                    - eu-falkenstein
                    - eu-nuremberg
                    - eu-helsinki
                  description: >-
                    Suji region slug. Volumes can only be attached to instances
                    in the same region.
                  example: eu-falkenstein
                autoMount:
                  type: boolean
                  default: true
                  description: >-
                    When true (default), the volume is formatted at create-time
                    and mounted at `/mnt/<name>` when attached to a running
                    instance.
                  example: true
                filesystem:
                  type: string
                  enum:
                    - ext4
                    - xfs
                  default: ext4
                  description: >-
                    Filesystem to format the volume with when `autoMount` is
                    true. Defaults to `ext4`.
                  example: ext4
