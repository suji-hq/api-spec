  /v1/orgs/{orgSlug}/projects/{projectSlug}/instances/{id}/snapshot:
    post:
      operationId: createInstanceSnapshot
      summary: Create a snapshot of an instance
      description: >-
        Queue a snapshot of the instance's disk via the cloud provider. Defaults
        to `mode: "cold"` (briefly powers the VM off for a consistent snapshot);
        `mode: "hot"` snapshots the live disk with no downtime. Returns
        immediately with `status: "uploading"` and `progress: 0`; clients poll
        `GET /:id/snapshots` to watch progress. If the per-plan or per-user
        quota is at limit, the oldest manual snapshot is auto-rotated before the
        new one starts (no client opt-out today).


        Gated on the org-level spending hard cap. The path is singular
        (`/snapshot`) for historical reasons — the matching list endpoint is
        plural (`/snapshots`).
      tags:
        - Instances
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum:
                    - hot
                    - cold
                  default: cold
      responses:
        '200':
          description: Snapshot queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  result:
                    type: object
                    properties:
                      id:
                        type: string
                      status:
                        type: string
                        const: uploading
                      progress:
                        type: integer
                    required:
                      - id
