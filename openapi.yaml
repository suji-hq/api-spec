    post:
      operationId: createOrg
      summary: Create an organization
      description: >-
        Create a new organization. The caller becomes its sole owner. A
        `Default` project is auto-created inside the new org. When `slug` is
        omitted, one is derived from `name` (lowercased, non-alphanumerics
        replaced with `-`, max 32 chars).


        A single user can own at most 10 organizations; further creates return
        422 `QUOTA_EXCEEDED` until you delete one. Rate-limited to 5 creates per
        hour per user. The first organization can be created with an unverified
        email; creating a second or more requires email verification (returns
        403 `EMAIL_VERIFICATION_REQUIRED`).
      tags:
