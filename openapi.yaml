      description: >-
        Return the cloud-provider firewall rules currently applied to the
        instance's VM. Mid-provisioning instances (no `providerServerId` yet)
        return an empty rule list. Wire field names are snake_case to match the
        cloud-agent / provider contract verbatim — see `firewallRuleSchema` for
        the per-rule semantics.
