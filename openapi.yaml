      summary: Resize an instance
      description: >-
        Change the instance's CPU, memory, and/or storage. The DB row is updated
        immediately; if the instance is `running`, `stopped`, `error`, or
        `suspended` the change is also applied to the underlying VM via a
        background resize job. `upgradeDisk` (default true) controls whether the
        disk is grown immediately as part of the same job. Storage can only grow
        — shrink requests return 409 `INVALID_RESIZE`. A no-op resize (same
        values) returns 200 with the current instance snapshot.
      tags:
        - Instances
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cpuMillicores:
                  type: integer
                  multipleOf: 1000
                  minimum: 1000
                memoryGi:
                  type: number
                  multipleOf: 1
                  minimum: 1
                storageGi:
                  type: integer
                  multipleOf: 1
                  minimum: 20
                upgradeDisk:
                  type: boolean
                  default: true
              required:
                - cpuMillicores
                - memoryGi
                - storageGi
      responses:
        '200':
          description: Resize accepted; new resource shape returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  result:
                    type: object
                    properties:
                      id:
                        type: string
                      cpuMillicores:
                        type: integer
                      memoryGi:
                        type: number
                      storageGi:
                        type: integer
                    required:
                      - id
                      - cpuMillicores
                      - memoryGi
                      - storageGi
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                        documentation_url:
                          type: string
                        source:
                          type: object
                          properties:
                            pointer:
                              type: string
                          required:
                            - pointer
                      required:
                        - code
                        - message
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
