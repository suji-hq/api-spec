      responses:
        '200':
          description: Historical analytics for the requested range
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  result:
                    type: object
                    properties:
                      range:
                        type: string
                        enum:
                          - 1h
                          - 6h
                          - 24h
                          - 7d
                          - 30d
                          - 90d
                      step:
                        type: string
                      start:
                        type: number
                      end:
                        type: number
                      cpu:
                        type: object
                        properties:
                          series:
                            type: array
                            items:
                              type: object
                              properties:
                                t:
                                  type: number
                                v:
                                  type: number
                              required:
                                - t
                                - v
                          avg:
                            type:
                              - number
                              - 'null'
                          peak:
                            type:
                              - number
                              - 'null'
                        required:
                          - series
                          - avg
                          - peak
                      memory:
                        type: object
                        properties:
                          series:
                            type: array
                            items:
                              type: object
                              properties:
                                t:
                                  type: number
                                v:
                                  type: number
                              required:
                                - t
                                - v
                          avg:
                            type:
                              - number
                              - 'null'
                          peak:
                            type:
                              - number
                              - 'null'
                        required:
                          - series
                          - avg
                          - peak
                      storage:
