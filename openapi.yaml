  /v1/orgs/{orgSlug}/projects/{projectSlug}/instances/{id}/logs:
    get:
      operationId: getInstanceLogs
      summary: Read or stream instance logs
      description: >-
        Return the most recent `?lines=` lines of log output for the instance
        (default 100, max 10000). The 200 response below describes the tail
        (JSON) mode.


        When `?follow=true`, the response upgrades to a `text/event-stream`
        connection that emits `event: log` (one per new line) and `event:
        heartbeat` every 5 seconds — useful for live tailing in a browser. The
        SSE wire shape is not modelled in this spec; subscribers cap at 5
        concurrent followers per instance (extra requests return 429 with error
        code `TOO_MANY_FOLLOWERS`).
      tags:
        - Instances
      responses:
        '200':
          description: Recent log lines (JSON tail mode)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  result:
                    type: object
                    properties:
                      lines:
                        type: array
                        items:
                          type: string
                    required:
                      - lines
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                        documentation_url:
                          type: string
                        source:
                          type: object
                          properties:
                            pointer:
                              type: string
                          required:
                            - pointer
                      required:
                        - code
                        - message
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                      required:
                        - code
                        - message
                required:
                  - success
                  - result
                  - errors
                  - messages
            text/event-stream:
              schema:
                type: string
                description: >-
                  When `?follow=true`, the connection upgrades to Server-Sent
                  Events. Each event is a UTF-8 frame: `event: log\ndata:
                  <line>\n\n` for each new log line, and `event:
                  heartbeat\ndata: <unix-ts>\n\n` every 5 seconds. The stream
                  stays open until the client disconnects.
