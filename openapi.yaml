      description: >-
        Return historical CPU / memory / storage time-series for the instance
        over the requested `?range=` window (default `24h`). The series come
        from Mimir (long-term metrics store) with a Redis snapshot fallback for
        very recent windows when Mimir hasn't ingested the latest sample yet.
        The step / resolution is paired with the range — 1m for 1h, 1d for 90d,
        etc.
      tags:
