        supplied list (max 50 rules). The call is a full replace, not a patch —
        omitted rules are removed. The cloud-agent re-injects a default
        `in/tcp/22 SSH` rule on every save unless the body supplies its own
        `in/tcp/22` override. Returns `{ status: 'ok' }`; clients reload via
